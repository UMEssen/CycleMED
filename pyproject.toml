[project]
name = "cyclemed"
version = "0.1.0"
description = "Medical CycleGAN pipeline with NIfTI preprocessing, dataset generation, training, and reconstruction."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "antspyx>=0.6,<0.7",
    "dominate>=2.9",
    "imageio>=2.37",
    "matplotlib>=3.8",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.12",
    "pillow>=10",
    "protobuf>=4",
    "scipy>=1.11",
    "simpleitk>=2.5",
    "torch>=2.1",
    "torchvision>=0.16",
    "tqdm>=4.67",
    "wandb>=0.16",
]

[tool.uv]
package = false
